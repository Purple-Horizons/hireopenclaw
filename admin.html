<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — HireOpenClaw</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --card: #111; --border: #222; --gray: #888; --white: #fff; --orange: #ff6b35; --green: #00c853; --yellow: #ffc107; --red: #ff5252; --purple: #9c27b0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--white); }
        
        /* Impersonate banner */
        .impersonate-banner { display: none; background: var(--purple); padding: 8px 20px; text-align: center; font-size: 13px; font-weight: 600; }
        .impersonate-banner.active { display: flex; justify-content: center; align-items: center; gap: 12px; }
        .impersonate-banner button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        /* Header */
        .header { padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 18px; flex: 1; }
        .header .badge { background: var(--purple); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
        .header a { color: var(--gray); text-decoration: none; font-size: 13px; }
        .header a:hover { color: var(--white); }
        
        /* Stats bar */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 20px 24px; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
        .stat .label { font-size: 11px; color: var(--gray); text-transform: uppercase; margin-bottom: 4px; }
        .stat .value { font-size: 24px; font-weight: 700; }
        .stat .sub { font-size: 12px; color: var(--gray); margin-top: 4px; }
        
        /* Search */
        .search-bar { padding: 0 24px 16px; display: flex; gap: 12px; }
        .search-bar input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; color: var(--white); font-size: 14px; outline: none; }
        .search-bar input:focus { border-color: var(--orange); }
        .search-bar select { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--white); font-size: 13px; }
        
        /* Client list */
        .clients { padding: 0 24px 24px; }
        .client-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
        .client-header { padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .client-header:hover { background: rgba(255,255,255,0.02); }
        .client-email { font-weight: 600; font-size: 14px; flex: 1; }
        .client-meta { display: flex; gap: 16px; font-size: 12px; color: var(--gray); }
        .client-meta .active { color: var(--green); }
        .pill, .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .pill.active, .badge-success { background: rgba(0,200,83,0.15); color: var(--green); }
        .pill.terminated, .badge-error { background: rgba(255,82,82,0.15); color: var(--red); }
        .pill.paused, .badge-warning { background: rgba(255,193,7,0.15); color: var(--yellow); }
        .badge-info { background: rgba(59,130,246,0.15); color: #3b82f6; }
        
        /* Bot list (expanded) */
        .client-bots { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
        .client-bots.open { display: block; }
        .bot-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .bot-row:last-child { border-bottom: none; }
        .bot-name { flex: 1; font-weight: 500; }
        .bot-actions { display: flex; gap: 6px; }
        .bot-actions button { background: var(--bg); border: 1px solid var(--border); color: var(--gray); padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .bot-actions button:hover { color: var(--white); border-color: var(--orange); }
        
        /* Action buttons */
        .btn { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-primary { background: var(--orange); color: white; }
        .btn-secondary { background: var(--card); border: 1px solid var(--border); color: var(--white); }
        .btn-danger { background: rgba(255,82,82,0.15); color: var(--red); border: 1px solid rgba(255,82,82,0.3); }
        
        /* Log viewer */
        .log-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .log-modal.open { display: flex; }
        .log-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 800px; max-height: 80vh; display: flex; flex-direction: column; }
        .log-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .log-body { flex: 1; overflow-y: auto; padding: 16px; font-family: 'SF Mono', monospace; font-size: 12px; line-height: 1.8; color: var(--gray); white-space: pre-wrap; }
        /* Toast notifications */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; animation: slideIn 0.3s ease; max-width: 400px; }
        .toast.success { background: var(--green); color: #000; }
        .toast.error { background: var(--red); color: #fff; }
        .toast.warning { background: var(--yellow); color: #000; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(40px); } }

        /* Inline confirm */
        .inline-confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
        .inline-confirm .warn { color: var(--red); font-weight: 600; }
        .inline-confirm button { padding: 4px 10px; border-radius: 4px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; }
        .inline-confirm .yes { background: var(--red); color: #fff; }
        .inline-confirm .no { background: rgba(255,255,255,0.1); color: var(--gray); }
        @media (max-width: 768px) {
            .search-bar { flex-direction: column; }
            .search-bar input, .search-bar select { max-width: 100%; box-sizing: border-box; font-size: 16px; }
            button, .btn, [role="button"] { min-height: 44px; min-width: 44px; padding: 10px 16px; }
        }
    </style>
</head>
<body>

<div class="impersonate-banner" id="impersonateBanner">
    <span>👁 Viewing as <strong id="impersonateEmail"></strong></span>
    <button onclick="stopImpersonate()">Exit</button>
    <a href="/dashboard" target="_blank" style="color:white;text-decoration:underline;font-size:12px;">Open their dashboard →</a>
</div>

<div class="header">
    <h1>🛡 Admin Dashboard</h1>
    <span class="badge">ADMIN</span>
    <a href="/dashboard">← My Dashboard</a>
</div>

<div class="stats" id="statsBar">
    <div class="stat"><div class="label">Total Clients</div><div class="value" id="statClients">—</div></div>
    <div class="stat"><div class="label">Active Clients</div><div class="value" id="statActiveClients">—</div></div>
    <div class="stat"><div class="label">Active Bots</div><div class="value" id="statActiveBots">—</div><div class="sub" id="statTotalBots"></div></div>
    <div class="stat"><div class="label">Terminated</div><div class="value" id="statTerminated">—</div></div>
</div>

<div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search clients by email..." oninput="filterClients()" aria-label="Search clients by email">
    <select id="filterStatus" onchange="filterClients()">
        <option value="all">All</option>
        <option value="active">Has Active Bots</option>
        <option value="none">No Active Bots</option>
    </select>
</div>

<!-- Platform Secrets -->
<div style="padding:0 24px 20px;">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <div>
                <h3 style="font-size:15px;">🔐 Platform Secrets</h3>
                <p style="font-size:12px;color:var(--gray);margin-top:4px;">API keys shared across all bot instances (fal-ai, OpenRouter, etc.)</p>
            </div>
            <button class="btn btn-primary" onclick="showAddSecret('platform')" style="font-size:12px;padding:6px 14px;">+ Add Secret</button>
        </div>
        <div id="platformSecrets"><p style="color:var(--gray);font-size:13px;">Loading...</p></div>
    </div>
</div>

<div class="clients" id="clientList">
    <p style="color:var(--gray);text-align:center;padding:40px;">Loading clients...</p>
</div>

<!-- Log viewer modal -->
<div class="log-modal" id="logModal" onclick="if(event.target===this)closeLogModal()">
    <div class="log-content">
        <div class="log-header">
            <strong id="logTitle">Logs</strong>
            <button class="btn btn-secondary" onclick="closeLogModal()" style="padding:4px 12px;">✕</button>
        </div>
        <div class="log-body" id="logBody">Loading...</div>
    </div>
</div>

<script>
// Parse session from hash fragment (same as dashboard) and check auth
(function() {
    const hash = window.location.hash;
    if (hash.includes('session=')) {
        const params = new URLSearchParams(hash.substring(1));
        const token = params.get('session');
        if (token) {
            localStorage.setItem('clawops_session_token', token);
            const email = params.get('email');
            if (email) localStorage.setItem('clawops_email', email);
        }
        history.replaceState(null, '', window.location.pathname);
    }
    // Check we have a token, otherwise redirect to login
    if (!localStorage.getItem('clawops_session_token')) {
        window.location.href = '/?login=true';
    }
})();
</script>
<script src="/js/admin.js?v=2"></script>
</body>
</html>
