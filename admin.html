<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — HireOpenClaw</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --card: #111; --border: #222; --gray: #888; --white: #fff; --orange: #ff6b35; --green: #00c853; --yellow: #ffc107; --red: #ff5252; --purple: #9c27b0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--white); }
        
        /* Impersonate banner */
        .impersonate-banner { display: none; background: var(--purple); padding: 8px 20px; text-align: center; font-size: 13px; font-weight: 600; }
        .impersonate-banner.active { display: flex; justify-content: center; align-items: center; gap: 12px; }
        .impersonate-banner button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        /* Header */
        .header { padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 18px; flex: 1; }
        .header .badge { background: var(--purple); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
        .header a { color: var(--gray); text-decoration: none; font-size: 13px; }
        .header a:hover { color: var(--white); }
        
        /* Stats bar */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 20px 24px; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
        .stat .label { font-size: 11px; color: var(--gray); text-transform: uppercase; margin-bottom: 4px; }
        .stat .value { font-size: 24px; font-weight: 700; }
        .stat .sub { font-size: 12px; color: var(--gray); margin-top: 4px; }
        
        /* Search */
        .search-bar { padding: 0 24px 16px; display: flex; gap: 12px; }
        .search-bar input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; color: var(--white); font-size: 14px; outline: none; }
        .search-bar input:focus { border-color: var(--orange); }
        .search-bar select { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--white); font-size: 13px; }
        
        /* Client list */
        .clients { padding: 0 24px 24px; }
        .client-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
        .client-header { padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .client-header:hover { background: rgba(255,255,255,0.02); }
        .client-email { font-weight: 600; font-size: 14px; flex: 1; }
        .client-meta { display: flex; gap: 16px; font-size: 12px; color: var(--gray); }
        .client-meta .active { color: var(--green); }
        .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .pill.active { background: rgba(0,200,83,0.15); color: var(--green); }
        .pill.terminated { background: rgba(255,82,82,0.15); color: var(--red); }
        .pill.paused { background: rgba(255,193,7,0.15); color: var(--yellow); }
        
        /* Bot list (expanded) */
        .client-bots { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
        .client-bots.open { display: block; }
        .bot-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .bot-row:last-child { border-bottom: none; }
        .bot-name { flex: 1; font-weight: 500; }
        .bot-actions { display: flex; gap: 6px; }
        .bot-actions button { background: var(--bg); border: 1px solid var(--border); color: var(--gray); padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .bot-actions button:hover { color: var(--white); border-color: var(--orange); }
        
        /* Action buttons */
        .btn { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-primary { background: var(--orange); color: white; }
        .btn-secondary { background: var(--card); border: 1px solid var(--border); color: var(--white); }
        .btn-danger { background: rgba(255,82,82,0.15); color: var(--red); border: 1px solid rgba(255,82,82,0.3); }
        
        /* Log viewer */
        .log-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .log-modal.open { display: flex; }
        .log-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 800px; max-height: 80vh; display: flex; flex-direction: column; }
        .log-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .log-body { flex: 1; overflow-y: auto; padding: 16px; font-family: 'SF Mono', monospace; font-size: 12px; line-height: 1.8; color: var(--gray); white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="impersonate-banner" id="impersonateBanner">
    <span>👁 Viewing as <strong id="impersonateEmail"></strong></span>
    <button onclick="stopImpersonate()">Exit</button>
    <a href="/dashboard" target="_blank" style="color:white;text-decoration:underline;font-size:12px;">Open their dashboard →</a>
</div>

<div class="header">
    <h1>🛡 Admin Dashboard</h1>
    <span class="badge">ADMIN</span>
    <a href="/dashboard">← My Dashboard</a>
</div>

<div class="stats" id="statsBar">
    <div class="stat"><div class="label">Total Clients</div><div class="value" id="statClients">—</div></div>
    <div class="stat"><div class="label">Active Clients</div><div class="value" id="statActiveClients">—</div></div>
    <div class="stat"><div class="label">Active Bots</div><div class="value" id="statActiveBots">—</div><div class="sub" id="statTotalBots"></div></div>
    <div class="stat"><div class="label">Terminated</div><div class="value" id="statTerminated">—</div></div>
</div>

<div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search clients by email..." oninput="filterClients()">
    <select id="filterStatus" onchange="filterClients()">
        <option value="all">All</option>
        <option value="active">Has Active Bots</option>
        <option value="none">No Active Bots</option>
    </select>
</div>

<!-- Platform Secrets -->
<div style="padding:0 24px 20px;">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <div>
                <h3 style="font-size:15px;">🔐 Platform Secrets</h3>
                <p style="font-size:12px;color:var(--gray);margin-top:4px;">API keys shared across all bot instances (fal-ai, OpenRouter, etc.)</p>
            </div>
            <button class="btn btn-primary" onclick="showAddSecret('platform')" style="font-size:12px;padding:6px 14px;">+ Add Secret</button>
        </div>
        <div id="platformSecrets"><p style="color:var(--gray);font-size:13px;">Loading...</p></div>
    </div>
</div>

<div class="clients" id="clientList">
    <p style="color:var(--gray);text-align:center;padding:40px;">Loading clients...</p>
</div>

<!-- Log viewer modal -->
<div class="log-modal" id="logModal" onclick="if(event.target===this)closeLogModal()">
    <div class="log-content">
        <div class="log-header">
            <strong id="logTitle">Logs</strong>
            <button class="btn btn-secondary" onclick="closeLogModal()" style="padding:4px 12px;">✕</button>
        </div>
        <div class="log-body" id="logBody">Loading...</div>
    </div>
</div>

<script>
let allClients = [];
let impersonating = null;

async function loadClients() {
    try {
        const res = await fetch('/api/admin/clients');
        if (res.status === 403) {
            document.getElementById('clientList').innerHTML = '<p style="color:var(--red);text-align:center;padding:40px;">Admin access required.</p>';
            return;
        }
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        allClients = data.clients;
        const s = data.summary;

        document.getElementById('statClients').textContent = s.totalClients;
        document.getElementById('statActiveClients').textContent = s.activeClients;
        document.getElementById('statActiveBots').textContent = s.activeBots;
        document.getElementById('statTotalBots').textContent = `of ${s.totalBots} total`;
        document.getElementById('statTerminated').textContent = s.terminatedBots;

        renderClients(allClients);
    } catch (err) {
        document.getElementById('clientList').innerHTML = `<p style="color:var(--red);text-align:center;padding:40px;">Error: ${err.message}</p>`;
    }
}

function renderClients(clients) {
    const el = document.getElementById('clientList');
    if (clients.length === 0) {
        el.innerHTML = '<p style="color:var(--gray);text-align:center;padding:40px;">No clients found.</p>';
        return;
    }

    el.innerHTML = clients.map(c => `
        <div class="client-card" id="client-${btoa(c.email)}">
            <div class="client-header" onclick="toggleBots('${btoa(c.email)}')">
                <div class="client-email">${c.email}</div>
                <div class="client-meta">
                    <span class="active">${c.activeBots} active</span>
                    <span>${c.totalBots} total</span>
                    <span>${c.firstSeen ? new Date(c.firstSeen).toLocaleDateString() : '—'}</span>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px;font-size:11px;" onclick="event.stopPropagation();impersonate('${c.email}')">👁 View as</button>
            </div>
            <div class="client-bots" id="bots-${btoa(c.email)}">
                ${c.bots.map(b => `
                    <div class="bot-row">
                        <span class="pill ${b.status}">${b.status}</span>
                        <span class="bot-name">${b.name || b.tenantId}</span>
                        <span style="color:var(--gray);font-size:11px;">${b.tenantId}</span>
                        <span style="color:var(--gray);font-size:11px;">${b.health}</span>
                        <div class="bot-actions">
                            ${b.status === 'active' ? `
                                <button onclick="viewLogs('${b.tenantId}')">📋 Logs</button>
                                <button onclick="restartBot('${b.tenantId}')">🔄 Restart</button>
                                <button onclick="viewConfig('${b.tenantId}')">⚙️ Config</button>
                                <button onclick="openChat('${b.tenantId}', '${(b.name || b.tenantId).replace(/'/g, "\\'")}')">💬 Chat</button>
                                <button onclick="backupBot('${b.tenantId}')">💾 Backup</button>
                                <button onclick="showBackups('${b.tenantId}')">📦 Restore</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `).join('');
}

function toggleBots(id) {
    const el = document.getElementById('bots-' + id);
    if (el) el.classList.toggle('open');
}

function filterClients() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('filterStatus').value;
    
    let filtered = allClients;
    if (q) filtered = filtered.filter(c => c.email.toLowerCase().includes(q));
    if (status === 'active') filtered = filtered.filter(c => c.activeBots > 0);
    if (status === 'none') filtered = filtered.filter(c => c.activeBots === 0);
    
    renderClients(filtered);
}

// ─── Bot actions ───

async function viewLogs(tenantId) {
    document.getElementById('logTitle').textContent = `Logs — ${tenantId}`;
    document.getElementById('logBody').textContent = 'Loading...';
    document.getElementById('logModal').classList.add('open');

    try {
        const res = await fetch(`/api/admin/bots/${tenantId}?action=logs&lines=100`);
        const data = await res.json();
        document.getElementById('logBody').textContent = data.ok ? data.logs.join('\n') : `Error: ${data.error}`;
    } catch (err) {
        document.getElementById('logBody').textContent = `Failed: ${err.message}`;
    }
}

async function viewConfig(tenantId) {
    document.getElementById('logTitle').textContent = `Config — ${tenantId}`;
    document.getElementById('logBody').textContent = 'Loading...';
    document.getElementById('logModal').classList.add('open');

    try {
        const res = await fetch(`/api/admin/bots/${tenantId}?action=config`);
        const data = await res.json();
        document.getElementById('logBody').textContent = data.ok ? JSON.stringify(data.config, null, 2) : `Error: ${data.error}`;
    } catch (err) {
        document.getElementById('logBody').textContent = `Failed: ${err.message}`;
    }
}

async function restartBot(tenantId) {
    if (!confirm(`Restart ${tenantId}?`)) return;
    try {
        const res = await fetch(`/api/admin/bots/${tenantId}?action=restart`, { method: 'POST' });
        const data = await res.json();
        alert(data.ok ? `✅ ${data.message}` : `❌ ${data.error}`);
    } catch (err) {
        alert(`Failed: ${err.message}`);
    }
}

function openChat(tenantId, name) {
    window.open(`/chat?botId=${encodeURIComponent(tenantId)}&name=${encodeURIComponent(name)}`, '_blank');
}

function closeLogModal() {
    document.getElementById('logModal').classList.remove('open');
}

// ─── Impersonate ───

async function impersonate(email) {
    try {
        const res = await fetch('/api/admin/impersonate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.ok) {
            impersonating = email;
            document.getElementById('impersonateBanner').classList.add('active');
            document.getElementById('impersonateEmail').textContent = email;
        }
    } catch {}
}

async function stopImpersonate() {
    try {
        await fetch('/api/admin/stop-impersonate', { method: 'POST' });
        impersonating = null;
        document.getElementById('impersonateBanner').classList.remove('active');
    } catch {}
}

// ─── Backup & Restore ───

async function backupBot(tenantId) {
    if (!confirm(`Create backup of ${tenantId}?`)) return;
    try {
        const res = await fetch(`/api/admin/bots/${tenantId}/backup`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: 'admin-manual' }) });
        const data = await res.json();
        alert(data.ok ? `✅ Backup created: ${data.backupId} (${(data.sizeBytes/1024).toFixed(1)} KB)` : `❌ ${data.error}`);
    } catch (err) { alert('Failed: ' + err.message); }
}

async function showBackups(tenantId) {
    document.getElementById('logTitle').textContent = `Backups — ${tenantId}`;
    document.getElementById('logBody').textContent = 'Loading...';
    document.getElementById('logModal').classList.add('open');

    try {
        const res = await fetch(`/api/admin/bots/${tenantId}/backups`);
        const data = await res.json();
        if (!data.ok || !data.backups.length) {
            document.getElementById('logBody').textContent = 'No backups found.';
            return;
        }
        document.getElementById('logBody').innerHTML = data.backups.map(b => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #333;">
                <div>
                    <strong>${b.backupId}</strong><br>
                    <span style="font-size:11px;">${b.createdAt} · ${b.sizeKB} KB · ${b.reason} · by ${b.triggeredBy}</span>
                </div>
                <button onclick="restoreBot('${tenantId}','${b.backupId}')" style="background:#ff6b35;color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;">Restore</button>
            </div>
        `).join('');
    } catch (err) {
        document.getElementById('logBody').textContent = 'Error: ' + err.message;
    }
}

async function restoreBot(tenantId, backupId) {
    if (!confirm(`⚠️ Restore ${tenantId} from ${backupId}? This overwrites current state.`)) return;
    try {
        const res = await fetch(`/api/admin/bots/${tenantId}/restore`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ backupId }) });
        const data = await res.json();
        alert(data.ok ? `✅ Restored from ${backupId}` : `❌ ${data.error}`);
    } catch (err) { alert('Failed: ' + err.message); }
}

// ─── Secrets ───

async function loadSecrets(scope, containerId) {
    const el = document.getElementById(containerId);
    try {
        const res = await fetch(`/api/admin/secrets?scope=${encodeURIComponent(scope)}`);
        const data = await res.json();
        if (!data.ok || !data.secrets.length) {
            el.innerHTML = '<p style="color:var(--gray);font-size:13px;">No secrets configured.</p>';
            return;
        }
        el.innerHTML = data.secrets.map(s => `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;">
                <code style="background:var(--bg);padding:4px 8px;border-radius:4px;font-size:12px;min-width:180px;">${s.key}</code>
                <span style="color:var(--gray);font-family:monospace;font-size:12px;">${s.preview}</span>
                <span style="color:var(--gray);font-size:11px;flex:1;">${s.label !== s.key ? s.label : ''}</span>
                <span style="color:var(--gray);font-size:11px;">${s.updatedAt ? new Date(s.updatedAt).toLocaleDateString() : ''}</span>
                <button onclick="deleteSecret('${scope}','${s.key}','${containerId}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;">✕</button>
            </div>
        `).join('');
    } catch (err) {
        el.innerHTML = `<p style="color:var(--red);font-size:13px;">Error: ${err.message}</p>`;
    }
}

async function showAddSecret(scope) {
    const key = prompt('Secret name (e.g., FAL_AI_API_KEY):');
    if (!key) return;
    const label = prompt('Label (optional description):', key);
    const value = prompt(`Value for ${key}:`);
    if (!value) return;

    try {
        const res = await fetch('/api/admin/secrets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scope, key: key.toUpperCase(), value, label: label || key })
        });
        const data = await res.json();
        if (data.ok) {
            loadSecrets(scope, scope === 'platform' ? 'platformSecrets' : `secrets-${btoa(scope)}`);
        } else {
            alert('Error: ' + data.error);
        }
    } catch (err) {
        alert('Failed: ' + err.message);
    }
}

async function deleteSecret(scope, key, containerId) {
    if (!confirm(`Delete secret ${key}?`)) return;
    try {
        await fetch('/api/admin/secrets', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scope, key })
        });
        loadSecrets(scope, containerId);
    } catch {}
}

// Init
loadClients();
loadSecrets('platform', 'platformSecrets');
</script>
</body>
</html>
