<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Login - ClawOps</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .verify-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 20px;
    }
    
    .verify-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    
    .spinner {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(255, 107, 53, 0.2);
      border-top-color: #ff6b35;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 32px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .verify-title {
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 16px;
    }
    
    .verify-message {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 32px;
    }
    
    .error-message {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
      padding: 16px;
      border-radius: 8px;
      margin-top: 24px;
    }
    
    .success-message {
      color: #51cf66;
      background: rgba(81, 207, 102, 0.1);
      padding: 16px;
      border-radius: 8px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="verify-container">
    <div class="verify-card">
      <div class="spinner" id="spinner"></div>
      <h1 class="verify-title" id="title">Verifying your login...</h1>
      <p class="verify-message" id="message">Please wait while we log you in.</p>
      <div id="status"></div>
    </div>
  </div>

  <script>
    async function verifyMagicLink() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      
      const spinner = document.getElementById('spinner');
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const status = document.getElementById('status');
      
      if (!token) {
        spinner.style.display = 'none';
        title.textContent = 'Invalid Link';
        message.textContent = 'This login link is missing a token.';
        status.innerHTML = '<div class="error-message">Please request a new magic link.</div>';
        return;
      }
      
      try {
        const res = await fetch(`/api/auth/magic-link?action=verify&token=${token}`, {
          method: 'GET'
        });
        
        const data = await res.json();
        
        if (data.ok) {
          // Save session token
          localStorage.setItem('clawops_session_token', data.sessionToken);
          localStorage.setItem('clawops_email', data.email);
          localStorage.setItem('clawops_session_expires', data.expiresAt);
          
          spinner.style.display = 'none';
          title.textContent = '✓ Login Successful!';
          message.textContent = `Welcome back, ${data.email}`;
          status.innerHTML = '<div class="success-message">Redirecting to your dashboard...</div>';
          
          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = `/dashboard.html?email=${encodeURIComponent(data.email)}`;
          }, 1500);
        } else {
          throw new Error(data.error || 'Verification failed');
        }
      } catch (err) {
        console.error('Verification failed:', err);
        spinner.style.display = 'none';
        title.textContent = 'Verification Failed';
        message.textContent = err.message || 'Something went wrong.';
        status.innerHTML = `
          <div class="error-message">
            ${err.message === 'Token expired' ? 'This login link has expired.' : 'This login link is invalid or has already been used.'}
            <br><br>
            <a href="/index.html" style="color: #ff6b35;">Request a new link</a>
          </div>
        `;
      }
    }
    
    // Run verification on page load
    verifyMagicLink();
  </script>
</body>
</html>
