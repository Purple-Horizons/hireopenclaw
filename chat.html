<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — HireOpenClaw</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0a; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 12px 20px; background: #111; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 12px; }
        .header .back { color: #888; text-decoration: none; font-size: 14px; }
        .header .back:hover { color: #fff; }
        .header .bot-name { font-weight: 600; font-size: 16px; flex: 1; }
        .header .status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .status.connected { background: rgba(0,200,83,0.15); color: #00c853; }
        .status.connecting { background: rgba(255,193,7,0.15); color: #ffc107; }
        .status.error { background: rgba(255,82,82,0.15); color: #ff5252; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #ff6b35; color: white; border-bottom-right-radius: 4px; }
        .msg.bot { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; border-bottom-left-radius: 4px; }
        .msg.system { align-self: center; color: #666; font-size: 12px; font-style: italic; }
        .typing { padding: 0 20px 8px; color: #666; font-size: 13px; display: none; }
        .typing.active { display: block; }
        .input-bar { padding: 16px 20px; background: #111; border-top: 1px solid #222; display: flex; gap: 12px; }
        .input-bar input { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: white; font-size: 14px; font-family: inherit; outline: none; }
        .input-bar input:focus { border-color: #ff6b35; }
        .input-bar button { background: #ff6b35; color: white; border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .input-bar button:hover { background: #e55a2b; }
        .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/dashboard" class="back">← Dashboard</a>
        <span class="bot-name" id="botName">AI Employee</span>
        <span class="status connecting" id="statusBadge">Connecting...</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing" id="typing">AI is thinking...</div>
    <div class="input-bar">
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const botId = params.get('botId');
    const botName = params.get('name') || 'AI Employee';
    
    document.getElementById('botName').textContent = botName;
    
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusBadge = document.getElementById('statusBadge');
    const typingEl = document.getElementById('typing');
    
    let sending = false;

    function setStatus(status, text) {
        statusBadge.className = 'status ' + status;
        statusBadge.textContent = text || (status === 'connected' ? 'Connected' : status === 'connecting' ? 'Connecting...' : 'Error');
        const ready = status === 'connected';
        inputEl.disabled = !ready;
        sendBtn.disabled = !ready;
        if (ready) inputEl.focus();
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = 'msg ' + type;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    // Connect SSE for real-time events
    function connectEvents() {
        if (!botId) {
            addMessage('Error: No bot ID. Go back to dashboard.', 'system');
            setStatus('error', 'No bot ID');
            return;
        }

        setStatus('connecting');
        addMessage('Connecting to your AI employee...', 'system');

        const evtSource = new EventSource(`/api/chat/${botId}/events`);
        
        evtSource.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === 'connected') {
                    setStatus('connected');
                    addMessage('Connected! Start chatting.', 'system');
                    loadHistory();
                    return;
                }
                
                if (data.type === 'error') {
                    setStatus('error', 'Connection failed');
                    addMessage('Connection error: ' + (data.message || 'Unknown'), 'system');
                    return;
                }
                
                if (data.type === 'disconnected') {
                    setStatus('error', 'Disconnected');
                    addMessage('Disconnected from bot. Refresh to reconnect.', 'system');
                    return;
                }

                // Handle all server-forwarded messages
                handleServerMessage(data);
            } catch {}
        };

        evtSource.onerror = () => {
            setStatus('error', 'Connection lost');
        };
    }

    let currentBotMsg = null;
    
    // Extract text from OpenClaw message format
    // Format: { role, content: [{type: "text", text: "..."}], timestamp }
    // or: { role, content: "string" }
    // or: just a string
    function extractText(message) {
        if (typeof message === 'string') return message;
        const content = message.content || message.text;
        if (typeof content === 'string') return content;
        if (Array.isArray(content)) {
            return content.filter(c => c.type === 'text').map(c => c.text).join('');
        }
        return '';
    }
    
    function handleServerMessage(msg) {
        // OpenClaw broadcasts: { type: "event", event: "chat", payload: { state, message } }
        // Also: { type: "res", ... } for request responses
        
        const isChatEvent = (msg.type === 'event' && msg.event === 'chat') ||
                            (msg.type === 'evt' && msg.event === 'chat');
        const eventData = msg.payload || msg.data;
        
        if (isChatEvent && eventData) {
            const { state, message } = eventData;
            
            if ((state === 'delta' || state === 'final') && message) {
                typingEl.classList.remove('active');
                const text = extractText(message);
                if (text) {
                    if (!currentBotMsg) {
                        currentBotMsg = addMessage(text, 'bot');
                    } else {
                        currentBotMsg.textContent = text; // Deltas are cumulative
                    }
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                }
                if (state === 'final') currentBotMsg = null;
            }
            
            if (state === 'error') {
                typingEl.classList.remove('active');
                addMessage('Bot error: ' + (eventData.error?.message || 'Unknown'), 'system');
                currentBotMsg = null;
            }
            return;
        }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`/api/chat/${botId}/history`);
            const data = await res.json();
            if (data.ok && data.messages && data.messages.length > 0) {
                // Clear system messages
                messagesEl.innerHTML = '';
                for (const msg of data.messages) {
                    const role = msg.role === 'user' ? 'user' : msg.role === 'assistant' ? 'bot' : 'system';
                    const text = extractText(msg);
                    if (text.trim()) addMessage(text, role);
                }
            }
        } catch {}
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || sending) return;
        
        sending = true;
        sendBtn.disabled = true;
        inputEl.value = '';
        currentBotMsg = null;
        
        addMessage(text, 'user');
        typingEl.classList.add('active');
        
        try {
            const res = await fetch(`/api/chat/${botId}/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            
            const data = await res.json();
            typingEl.classList.remove('active');
            
            if (res.status === 401) {
                addMessage('Session expired. Please log in again.', 'system');
                setStatus('error', 'Unauthorized');
                return;
            }
            
            if (res.status === 403) {
                addMessage('Access denied. This is not your bot.', 'system');
                setStatus('error', 'Forbidden');
                return;
            }
            
            if (!data.ok) {
                addMessage('Error: ' + (data.error?.message || data.error || 'Unknown error'), 'system');
            }
            // Response text may come via SSE events, or in the response
            // The chat.send response in OpenClaw may just be an ack
            
        } catch (err) {
            typingEl.classList.remove('active');
            addMessage('Failed to send: ' + err.message, 'system');
        } finally {
            sending = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }

    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Start
    connectEvents();
    </script>
</body>
</html>
