<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — HireOpenClaw</title>
    <meta name="description" content="Log in to your HireOpenClaw account">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --white: #ffffff;
            --gray: #888888;
            --light-gray: #333333;
            --accent: #ff6b35;
            --accent-dim: #ff6b3520;
            --green: #10b981;
            --red: #ef4444;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--white);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--light-gray);
            border-radius: 16px;
            padding: 48px;
            max-width: 440px;
            width: 100%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo a {
            font-size: 28px;
            font-weight: 800;
            color: var(--white);
            text-decoration: none;
        }
        
        .logo a span {
            color: var(--accent);
        }
        
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .subtitle {
            font-size: 15px;
            color: var(--gray);
            text-align: center;
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--white);
        }
        
        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--white);
            font-family: inherit;
            transition: border-color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        input::placeholder {
            color: var(--gray);
        }
        
        .btn {
            width: 100%;
            background: var(--accent);
            color: var(--bg);
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .message.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--green);
            display: block;
        }
        
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--red);
            display: block;
        }
        
        .divider {
            text-align: center;
            margin: 28px 0;
            color: var(--gray);
            font-size: 14px;
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: var(--light-gray);
        }
        
        .divider::before {
            left: 0;
        }
        
        .divider::after {
            right: 0;
        }
        
        .signup-link {
            text-align: center;
            font-size: 14px;
            color: var(--gray);
        }
        
        .signup-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        footer {
            border-top: 1px solid var(--light-gray);
            padding: 24px;
            text-align: center;
        }
        
        footer p {
            color: var(--gray);
            font-size: 13px;
        }
        
        footer a {
            color: var(--gray);
            text-decoration: none;
        }
        
        footer a:hover {
            color: var(--accent);
        }
        
        @media (max-width: 768px) {
            .login-card {
                padding: 32px 24px;
            }
            
            /* Touch targets */
            button, .btn, a { min-height: 44px; min-width: 44px; }
            /* Prevent iOS zoom */
            input { font-size: 16px !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <a href="/">Hire<span>OpenClaw</span></a>
            </div>
            
            <h1>Welcome back</h1>
            <p class="subtitle">Enter your email to receive a magic login link</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="you@example.com"
                        autocomplete="email"
                    >
                </div>
                
                <button type="submit" class="btn">
                    <span class="btn-text">Send Login Link</span>
                    <span class="btn-loading" style="display:none;">Sending...</span>
                </button>
                
                <div id="message" class="message"></div>
            </form>
            
            <div class="divider">or</div>
            
            <p class="signup-link">
                Don't have an account? <a href="/signup">Sign up</a>
            </p>
        </div>
    </div>
    
    <footer>
        <p><a href="/">← Back to home</a></p>
    </footer>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const btn = form.querySelector('button');
            const btnText = btn.querySelector('.btn-text');
            const btnLoading = btn.querySelector('.btn-loading');
            const message = document.getElementById('message');
            const email = form.querySelector('input[name=email]').value;
            
            // Disable button and show loading
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            btn.disabled = true;
            message.style.display = 'none';
            message.className = 'message';
            
            try {
                const response = await fetch('/api/auth/magic-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    message.className = 'message success';
                    message.innerHTML = '✓ Check your email! We sent you a login link.';
                    
                    // For local dev, show the link if available
                    if (data.magicLink) {
                        setTimeout(() => {
                            message.innerHTML = `✓ Check your email! We sent you a login link.<br><br>
                                <a href="${data.magicLink}" style="color:var(--accent);text-decoration:underline;">Click here to log in (dev mode)</a>`;
                        }, 500);
                    }
                } else {
                    throw new Error(data.error || 'Failed to send login link');
                }
            } catch (error) {
                message.className = 'message error';
                message.innerHTML = `✗ ${error.message}`;
            } finally {
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
